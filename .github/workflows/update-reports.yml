name: Update Reports

on:
  repository_dispatch:
    types: [add-report]

jobs:
  update-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.MATH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Update reports.json
        env:
          REPORT_DATA: ${{ github.event.client_payload.report }}
        run: node .github/workflows/update-reports.js

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add reports.json
          git commit -m "Add new report" || exit 0
          git push
